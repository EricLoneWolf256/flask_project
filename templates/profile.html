<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ username }}'s Profile</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; text-align: center; padding: 50px; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>
    <div class="card">
        {#<!-- Jinja2 placeholders filled by Python -->#}
         <h2>{{"Welcome, " + first_name | title}}</h2>
        <h1>{{ first_name | upper}} {{ last_name | upper }}</h1>
        <p>The Total Courses: {{ course | length }}</p>
        <p>I live in City: {{city}}</p>
        <p>The price of this course is ${{price}}</p>
        <p>GST Included Price: ${{price * 1.1}}</p>
    </div>
</body>
</html>
